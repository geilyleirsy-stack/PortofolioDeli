    <script>

            theme: {
                extend: {
                    colors: {
                        navy: {
                            700: '#1D3557',
                            800: '#1E293B',
                            900: '#0F172A',

                }
            }
        }

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

<body class="bg-white text-slate-800 antialiased selection:bg-navy-900 selection:text-white">
